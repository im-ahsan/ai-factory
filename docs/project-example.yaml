# Copy to ~/.factory/projects/<name>.yaml and edit. No secrets in this file.
project: shop-api                  # lowercase name you'll pass to --project
repo: /home/<you>/code/shop-api     # must be inside Linux (not /mnt/c/...)
baseBranch: main
stack: dotnet                      # or node: a new product (a TypeScript app built from an approved design). `factory init`
                                   # on an empty repo writes stack: node (added for greenfield, 2026-10-04)
# node:                            # stack: node only; these are the defaults
#   image: node:22-bookworm
#   buildTimeoutSec: 900
#   testTimeoutSec: 900
dotnet:
  sdkImage: mcr.microsoft.com/dotnet/sdk:8.0   # match the repo's global.json
  solution: ShopApi.sln                     # optional; a .sln or .csproj path from the repo root. Leave out if
                                            # the root has one, or there's a single one below it (auto-detected)
  # runnerArgs: ["xUnit.ParallelizeTestCollections=false"]   # extra test-runner settings
database:                          # throwaway Postgres for tests (never your real DB)
  image: postgres:16-alpine
  name: app_test                    # the database your tests expect
  # user: postgres                  # the login your tests hardcode (created WITHOUT superuser)
  # passwordEnv: SHOP_TEST_DB_PASSWORD   # its password, stored in ~/.factory/.env
  producerEnv:                     # only the test container gets these
    ConnectionStrings__DefaultConnection: "Host={{DB_HOST}};Port={{DB_PORT}};Database={{DB_NAME}};Username={{DB_USER}};Password={{DB_PASSWORD}}"
agentEnv:                          # dummy values so the app compiles where the AI works
  ConnectionStrings__DefaultConnection: "Host=localhost;Database=dummy;Username=dummy;Password=dummy"
# referenceDb: { connEnv: SHOP_READONLY_DB }   # read-only, discover only; value lives in ~/.factory/.env
# forge: { kind: github, repo: owner/name, tokenEnv: GITHUB_TOKEN }   # leave out until you want real PRs
# Start runs from Jira with `factory watch` (see "Start runs from Jira" in the README). Leave out to keep it off.
# jira:
#   project: SHOP                         # the Jira project key
#   label: factory                        # adding this label starts a run
#   allowedReporters: [you@example.com]   # only labels added by these people (email or Jira account id) count
#   transitions: { started: In Progress, delivered: In Review }   # optional ticket moves
#   maxCostPerRun: 3                      # like --max-cost for every run it starts
#   maxRunsPerDay: 3
#   dailyBudgetUsd: 10
#   monthlyBudgetUsd: 100
# notify:
#   slackWebhookEnv: SHOP_SLACK_WEBHOOK   # the webhook URL itself lives in ~/.factory/.env
# Prices (USD per million tokens) for models the factory has no built-in price for, e.g. the GPT model
# used for the critic and review when OPENAI_API_KEY is set. Without a price, cost is estimated at
# $10 in / $50 out, which is deliberately high and can hit the run's cost limit early.
# prices:
#   gpt-5.5: { input: <from OpenAI's pricing page>, output: <...>, cacheRead: <...> }
# A repo with a React or Next.js front end: tell the design checks where things are when detection guesses wrong.
# design:
#   sourceRoot: "src/"               # "" is the repo root
#   uiDir: "src/components/ui"       # the building-block folder
#   brandFonts: ["Acme Sans"]        # fonts the design brief may name besides Google Fonts
#   navRaises: false                 # true: a navigation change counts as a new screen
#   uiTarget: next-shadcn            # what the approved design is built in: next-shadcn, vite-shadcn, or repo (its own components);
#                                    # unset: --ui-target, then detection from the repo (factory design target <repo>)
#   uiTargets: { mobile: repo }      # per app id of a product with several, over uiTarget
#   capture:                         # opt-in visual check after a UI-changing build (docs/design-step.md)
#     allowHost: true                # REQUIRED: you agree to run the start command on this machine
#     install: "npm ci"
#     start: "npm run start -- -p $PORT"
#     pages: [{ name: home, path: "/" }, { name: orders, path: "/orders" }]
#     readyPath: "/"
#   fidelity:                        # check of the built app against the approved design, after accept; on by default for kit scaffolds
#                                    # and for screens changed in place (2026-10-04: opened at their routes, structure and own-look tokens
#                                    # as advice); `fidelity: false` switches it off (docs/estimates-design.md, "Fidelity and tests")
#     allowHost: true                # optional: run the app on this machine instead of in containers (the default, 2026-10-04)
#     install: "npm install --no-audit --no-fund"   # the default
#     start: "npx next build && npx next start -p $PORT"   # default per target (vite: vite build && vite preview); an existing app: its own start or preview script
#     port: 4320
#     readyPath: "/"
#     timeoutSec: 600
#     maxPages: 160                  # pages opened at most (states x widths x modes x languages)
