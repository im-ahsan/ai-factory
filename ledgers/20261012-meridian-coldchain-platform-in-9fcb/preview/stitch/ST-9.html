  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #F7F7F7;
      --surface: #FFFFFF;
      --text: #202020;
      --text-muted: #626262;
      --border: #D5D5D5;
      --primary: #A94B1D;
      --status-good: #24704B;
      --status-waiting: #805800;
      --status-refused: #AE2C2C;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Public Sans', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .font-heading {
      font-family: 'Hanken Grotesk', sans-serif;
    }

    .font-mono-code {
      font-family: 'IBM Plex Mono', monospace;
    }

    /* 2px corners rule */
    .corner-2px {
      border-radius: 2px;
    }

    /* Inputs, buttons, panels */
    .field-input {
      height: 48px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      font-family: 'Public Sans', sans-serif;
      font-size: 16px;
      padding: 0 16px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .field-input.mono-val {
      font-family: 'IBM Plex Mono', monospace;
    }

    .btn-primary {
      height: 48px;
      background-color: var(--primary);
      color: #FFFFFF;
      border: 1px solid var(--primary);
      border-radius: 2px;
      font-family: 'Public Sans', sans-serif;
      font-size: 16px;
      font-weight: 600;
      padding: 0 24px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s ease, background-color 0.15s ease;
    }

    .btn-primary:hover {
      opacity: 0.92;
    }

    .btn-primary:active {
      opacity: 0.84;
    }

    .btn-primary:focus {
      outline: none;
      box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px var(--primary);
    }

    /* Motion specifications */
    @keyframes entranceFade {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes savedHandoff {
      from {
        opacity: 0.6;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes waitingBreathe {
      0%, 100% {
        opacity: 0.7;
      }
      50% {
        opacity: 1;
      }
    }

    .animate-entrance {
      animation: entranceFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  <!-- Header: The same on every page -->
  <header class="bg-white border-b border-[#D5D5D5] h-[64px] flex items-center px-8 justify-between shrink-0">
    <!-- Left: Logo & Menu -->
    <div class="flex items-center gap-8">
      <div class="flex items-center gap-3">
        <div class="w-6 h-6 bg-[#202020] text-white flex items-center justify-center font-bold text-sm corner-2px">
          M
        </div>
        <span class="font-heading font-[650] text-lg text-[#202020] tracking-tight">Meridian</span>
      </div>

      <!-- Navigation Menu -->
      <nav class="flex items-center gap-6 h-[64px]">
        <a href="#" class="h-full flex items-center text-[#A94B1D] font-medium border-b-2 border-[#A94B1D] px-1 text-[15px]">

        </a>
        <a href="#" class="h-full flex items-center text-[#626262] hover:text-[#202020] transition-colors font-medium border-b-2 border-transparent px-1 text-[15px]">

    </div>

            </div>

            <!-- Packs -->

                Packs
              </label>
              <input type="text" id="pack-quantity" class="field-input mono-val" value="120" readonly="">
            </div>

            <!-- Supplier -->
            <div>
              <label class="block text-sm font-semibold text-[#202020] mb-2" for="supplier-name">
                Supplier
              </label>
              <input type="text" id="supplier-name" class="field-input" value="supplier named on the returned receipt" readonly="">
            </div>

            <!-- Destination location -->
            <div class="md:col-span-2">
              <label class="block text-sm font-semibold text-[#202020] mb-2" for="storage-location">
                Destination location
              </label>
              <input type="text" id="storage-location" class="field-input" value="North Quay Cold Room C2 Rack 4" readonly="">
            </div>
          </div>

          <!-- Informational note about inbound temperatures & quarantine -->

            <p class="text-sm text-[#626262] leading-relaxed m-0">

            </p>
          </div>

          <!-- Primary Action: Save receipt as the only primary action -->
          <div class="pt-2">
            <button type="submit" class="btn-primary w-full sm:w-auto">
              Save receipt
            </button>
          </div>

        </form>
      </section>

      <!-- Right side remains open on desktop as instructed -->
      <div class="hidden lg:block lg:col-span-4"></div>

    </div>
  </main>
