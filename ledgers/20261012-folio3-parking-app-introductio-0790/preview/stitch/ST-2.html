    /* Design System Tokens */

      line-height: 22px;
      margin: 0;
      padding: 0;

      font-family: 'Hanken Grotesk', sans-serif;
    }
    
    .font-mono-code {
      font-family: 'IBM Plex Mono', monospace;
    }
    
    /* Keyframes */
    @keyframes panelEntrance {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes parkingRecordSettle {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

        opacity: 0.96;
      }
      50% {
        opacity: 1;
      }
    }

    .entrance-animate {

    }

    .btn-action {

      border-color: #BAC7D5;
    }

      background-color: #EEF2F6;
    }

                  transform var(--motion-duration-fast) var(--motion-ease-standard);

    .retry-btn:hover {
      background-color: #FFFFFF;
      border-color: #BAC7D5;
      color: var(--text-main);
    }
    
    .retry-btn:active {
      transform: scale(0.96);
    }
    
    .retry-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px var(--primary);
    }

    @media (prefers-reduced-motion: reduce) {
      .entrance-animate,
      .btn-action,
      .retry-btn {

        transition: none !important;
        transform: none !important;
      }
    }

    <!-- One sentence description -->

      Use your Folio3 Google account to manage parking.

    <!-- Sole primary action: Continue with Google -->

      </svg>
      <span>Continue with Google</span>
    </button>

    <!-- One quiet line explaining employee access policy -->
    <p class="mt-6 text-[#5D6A75] text-[13px] leading-[20px]">
      Access is for active Folio3 employees.
    </p>

  </main>
